[package]
name = "hermes-crypto"
version = "0.1.0"
edition = "2024"
description = "Hermes shared crypto core: Double Ratchet, hybrid PQ-MLS, Ed25519, CRDT reconciliation, FTS5 helpers."
license = "MIT"

[lib]
name = "hermes_crypto"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
uniffi = { version = "0.28", default-features = false }

# Ed25519 signing / verification (message integrity, <1ms verify target)
ed25519-dalek = { version = "2", features = ["rand_core"] }

# X25519 for the classical half of hybrid PQ key exchange + ratchet DH
x25519-dalek = { version = "2", features = ["static_secrets"] }

# ML-KEM (Kyber) for the post-quantum half — "harvest now, decrypt later" defense
ml-kem = "0.3"

# HKDF / SHA-256 KDFs for ratchet key derivation
hkdf = "0.12"
sha2 = "0.10"

# AEAD for message encryption (XChaCha20-Poly1305 via libsodium-style construction)
chacha20poly1305 = "0.10"

# Deterministic randomness
rand_core = { version = "0.6", features = ["std"] }
getrandom = "0.2"

# CRDT: Lamport timestamps + LWW registers (no external deps; pure logic)
thiserror = "1"
